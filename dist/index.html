<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#334d3b"><title>계란으로 바위치기</title><link rel="stylesheet" href="style.css"></head><body>
<div id="game"><canvas id="world" width="1100" height="650" aria-label="방향키 또는 WASD로 농장주 이동, 클릭으로 이동 및 도구 사용"></canvas><div class="vignette"></div><div class="hud"><div class="timeblock"><span id="day"></span><span id="autosave">저장됨</span></div><div id="sceneLabel"></div><div class="hudright"><div id="resources"></div><button id="menuBtn" title="일시정지" aria-label="일시정지">Ⅱ</button></div></div><div id="quest"></div><div id="care"></div><button id="context" class="context hidden"></button><div id="sceneNote"></div><div class="dock"><div id="toolbar"></div><div class="utility"><button data-action="bag" title="가방 (B)">🎒<small>가방 B</small></button><button data-action="journal" title="농장 수첩 (J)">📖<small>수첩 J</small></button><button data-action="worldmap" title="지도 (M)">🗺<small>지도 M</small></button></div></div><div class="movement"><span>W A S D / 방향키</span> 이동 <span>E</span> 상호작용</div><div id="touchpad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div id="fade"></div></div>
<div hidden><a id="logo"></a><div id="eyebrow"></div><div id="title"></div><div id="subtitle"></div><div id="journey"></div><div id="panel"></div></div><div id="toast" role="status"></div><div id="overlay" class="overlay"></div><script src="game.js"></script><script src="immersive.js"></script></body></html>
